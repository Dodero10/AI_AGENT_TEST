[project]
name = "basic-agentic"
version = "0.1.0"
description = "Agentic Retrieval-Augmented Generation (RAG) system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.65.1",
    "langchain>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-google-genai>=0.0.6",
    "langchain-huggingface>=0.0.2",
    "langchain-openai>=0.0.5",
    "pypdf>=4.0.0",
    "faiss-cpu>=1.7.4",
    "athina-client>=0.1.0",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.2.2",
    "langsmith>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["."]
